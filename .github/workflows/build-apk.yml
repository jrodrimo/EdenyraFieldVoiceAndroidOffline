name: Build Edenyra Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      PROJECT_DIR: extracted/EdenyraFieldVoiceAndroidOfflineBuildable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Unpack Android project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q EdenyraFieldVoiceAndroidOfflineBuildable.zip -d extracted
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Download Whisper multilingual base model
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets/models"
          curl -L --fail --retry 3 \
            -o "$PROJECT_DIR/app/src/main/assets/models/ggml-base.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          ls -lh "$PROJECT_DIR/app/src/main/assets/models/ggml-base.bin"
          test $(stat -c%s "$PROJECT_DIR/app/src/main/assets/models/ggml-base.bin") -gt 100000000

      - name: Remove obsolete Gradle model-download task
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/EdenyraFieldVoiceAndroidOfflineBuildable/app/build.gradle.kts")
          s = p.read_text()
          marker = "// The model is intentionally not stored in this ZIP"
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + "\n"
          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare downloadable APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi
          cp "$APK" Edenyra-Field-Voice-offline.apk
          ls -lh Edenyra-Field-Voice-offline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Edenyra-Field-Voice-offline-APK
          path: Edenyra-Field-Voice-offline.apk
          if-no-files-found: error
